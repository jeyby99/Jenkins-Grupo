services:
  controlador:
    build: ./controlador
    container_name: jenkins-controlador
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 1536m

  agente-python:
    build:
      context: .
      dockerfile: agentes/python.Dockerfile
    container_name: jenkins-agente-python
    restart: unless-stopped
    depends_on:
      - controlador
    environment:
      JENKINS_URL: http://controlador:8080
      NOMBRE: agente-python
      SECRETO: ${SECRETO_AGENTE_PYTHON}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pip-cache:/root/.cache/pip
    mem_limit: 1024m

  agente-browser:
    build:
      context: .
      dockerfile: agentes/browser.Dockerfile
    container_name: jenkins-agente-browser
    restart: unless-stopped
    depends_on:
      - controlador
    environment:
      JENKINS_URL: http://controlador:8080
      NOMBRE: agente-browser
      SECRETO: ${SECRETO_AGENTE_BROWSER}
    volumes:
      - pip-cache:/root/.cache/pip
    mem_limit: 2048m
    shm_size: 1gb

  # Relé de webhooks: smee.io -> controlador. Solo arranca si lo nombras
  # (docker compose up -d smee); un "up" normal no lo levanta.
  smee:
    image: node:22.23.5-alpine
    container_name: jenkins-smee
    restart: unless-stopped
    profiles: ["webhook"]
    depends_on:
      - controlador
    environment:
      SMEE_URL: ${SMEE_URL:-}
    command:
      - sh
      - -c
      - exec npx --yes smee-client@5.0.0 --url "$${SMEE_URL:?Falta SMEE_URL en jenkins/.env}" --target http://controlador:8080/github-webhook/
    mem_limit: 256m

volumes:
  jenkins_home:
  pip-cache:
