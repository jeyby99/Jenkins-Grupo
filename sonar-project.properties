# PERSONA 2 · Configuración de SonarQube Cloud
# Completa organization y projectKey con los datos de su cuenta de SonarQube Cloud.

sonar.organization=jeyby99
sonar.projectKey=jeyby99_Jenkins-Grupo
sonar.projectName=Calculadora de pasajes - Grupo 4

# Código que se analiza (Python, plantillas HTML y CSS) y código de pruebas
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Reporte de cobertura que genera: pytest tests/unitarias --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# Las rutas Flask (auth.py, rutas.py) y modelos.py se prueban con Playwright,
# no con pytest unitario. Las sacamos del cálculo de cobertura para que el
# porcentaje mida solo la lógica que sí tiene pruebas unitarias.
sonar.coverage.exclusions=app/auth.py,app/rutas.py,app/modelos.py,app/__init__.py,app/extensiones.py,app/templates/**,app/static/**
